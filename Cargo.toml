[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"
repository = "https://github.com/userNanni/between-frontiers"

[workspace.dependencies]
laplace-schelling = { path = "crates/laplace-schelling" }
bf-sim = { path = "crates/bf-sim" }
bf-i18n = { path = "crates/bf-i18n" }
bf-ui-kit = { path = "crates/bf-ui-kit" }

serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.3"
postcard = { version = "1.1.3", features = ["use-std"] }
blake3 = "1.8.7"
rayon = "1.12.0"
serde_json = "1.0.149"
bytemuck = { version = "1.25.2", features = ["derive"] }
png = "0.18.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
directories = "6.0.0"
fluent-bundle = "0.16.0"
unic-langid = { version = "0.9.6", features = ["macros"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11", "persistence"] }
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }
wgpu = "30.0.2"
shapefile = "0.9.0"
geo = "0.33.1"
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"

[profile.dev]
opt-level = 1
